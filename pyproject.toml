[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "firefighter"
version = "0.1.0a1"
description = "Extensible incident orchestration core"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
firefighter = "firefighter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firefighter"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
