[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dowser"
version = "0.1.0a1"
description = "Extensible incident orchestration core"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
jev = ["httpx>=0.28,<1", "python-dotenv>=1.0,<2"]
itbench-aa = ["huggingface-hub>=1.0,<2", "PyYAML>=6,<7"]
nxos = ["httpx>=0.28,<1", "asyncssh>=2.20,<3"]
vllm = ["httpx>=0.28,<1", "prometheus-client>=0.21,<1"]

[project.scripts]
dowser = "dowser.cli:main"
dowser-bench = "dowser.bench:main"

[tool.hatch.build.targets.wheel]
packages = ["dowser", "plugins"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
